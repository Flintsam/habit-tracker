<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Habit Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>🔥 Habit Tracker</h1>
        <p>Build better habits, one day at a time.</p>
        <div>
            <p id="quote-text">Loading quote...</p>
        </div>
    </header>
    <main>

        <section>
            <h2>Add Habit</h2>

            <form id="habit-form">
                <label for="habit-name">Habit name</label>
                <input
                    type="text"
                    id="habit-name"
                    placeholder="e.g., Exercise"
                    required
                >

                <button type="submit">Add Habit</button>
            </form>
        </section>

        <section>
            <h2>Your Habits</h2>
            <ul id="habit-list"></ul>
        </section>

        <section>
            <h2>Log Today's Progress</h2>

            <form id="entry-form">

                <label for="entry-habit">Habit</label>
                <select id="entry-habit" required>
                    <option value="">Select a habit</option>
                </select>

                <label for="entry-date">Date</label>

                <input type="date" id="entry-date" required>

                <label>
                    <input type="checkbox" id="entry-completed">
                    Completed
                </label>

                <label for="entry-mood">Mood</label>
                <select id="entry-mood" required>
                    <option value="">Select mood</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <br><br>

                <button type="submit">Log Entry</button>

            </form>
        </section>
        <section>
            <h2>Recent Entries</h2>
            <p id="entry-loading">Loading entries...</p>

            <ul id="entry-list"></ul>
        </section>

    </main>
    <script src="app.js"></script>

</body>
</html>
